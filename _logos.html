<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font:12px Arial;background:#888}#g{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:6px}.c{height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:8px;position:relative}.c small{position:absolute;bottom:3px;left:5px;right:5px;font-size:9px;color:#f0f;background:rgba(255,255,255,.8);overflow:hidden;white-space:nowrap}iframe{position:absolute;left:-5000px;width:1440px;height:900px}</style></head><body><div id="g"></div><iframe id="f"></iframe><script>
var q=new URLSearchParams(location.search),f=document.getElementById('f');f.src=q.get('u');
function bg(el,w){while(el){var c=w.getComputedStyle(el).backgroundColor,i=w.getComputedStyle(el).backgroundImage;if(c&&c!=='rgba(0, 0, 0, 0)'&&c!=='transparent')return c;if(i&&i!=='none')return '#333';el=el.parentElement}return '#fff'}
f.onload=function(){setTimeout(function(){var d=f.contentDocument,w=f.contentWindow,g=document.getElementById('g');d.querySelectorAll('img[src*="logos/"]').forEach(function(im,k){var s=w.getComputedStyle(im);var c=document.createElement('div');c.className='c';c.style.background=bg(im.parentElement,w);var n=document.createElement('img');n.src=im.src;n.style.height=(im.getBoundingClientRect().height||s.height.replace('px',''))+'px';n.style.filter=s.filter;n.style.opacity=s.opacity;n.style.maxWidth='90%';c.appendChild(n);var l=document.createElement('small');l.textContent=k+' '+im.getAttribute('src').replace('assets/logos/','')+' | '+(im.closest('section,header,footer')||{}).className;c.appendChild(l);g.appendChild(c)})},2500)}
</script></body></html>
