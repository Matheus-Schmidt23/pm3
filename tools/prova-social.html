      <div><p class="kicker"><span class="n">{{N}}</span> Impacto na carreira</p><h2 class="h2" id="dp-t">Quem passa pela PM3<br><span class="c2">recomenda</span></h2></div>
      <p class="lead">A cada 10 profissionais de produto no Brasil, 9&nbsp;conhecem a PM3. Faça parte de uma comunidade que realmente impacta o mercado.</p>
    </div>
