<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acesso · Protótipo PM3</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="assets/logo/pm3-simbolo-roxo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;background:#000;font-family:var(--body);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
  .bg{position:fixed;inset:12px;display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:1fr 1fr;gap:12px;z-index:0}
  .bg div{border-radius:0}
  .g1{grid-row:1/3;background:var(--purple-deep);border-radius:var(--r-xl) 0 0 var(--r-xl) !important}
  .g2{background:url('assets/tex/tex-dobras-lilas.jpg') center/cover;border-radius:0 var(--r-xl) 0 0 !important}
  .g3{background:url('assets/tex/tex-fitas-vidro.jpg') center/cover;border-radius:0 0 var(--r-xl) 0 !important}
  .card{position:relative;z-index:1;background:#fff;border-radius:var(--r-xl);padding:44px 40px 38px;width:100%;max-width:420px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .card img{height:44px;width:auto;margin-bottom:24px;display:block}
  .k{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--purple-royal);margin:0 0 8px}
  h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:.98;text-transform:uppercase;letter-spacing:-.025em;margin:0 0 12px}
  p{font-size:14.5px;color:#4a4458;margin:0 0 22px;line-height:1.5}
  form{display:grid;gap:12px}
  label{font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
  input{font-family:var(--body);font-size:16px;padding:14px 16px;border-radius:var(--r-btn);border:1.5px solid #cfcad9;outline:none;width:100%;transition:border-color .2s,box-shadow .2s}
  input:focus{border-color:var(--purple-royal);box-shadow:0 0 0 4px rgba(102,69,177,.18)}
  button{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;border:0;border-radius:var(--r-btn);padding:16px 28px;cursor:pointer;background:var(--purple-royal);color:#fff;transition:background .2s,transform .2s}
  button:hover{background:var(--purple-deep);transform:translateY(-2px)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
  .err{min-height:20px;font-size:13.5px;font-weight:600;color:#b3222f;margin:0}
  .shake{animation:sh .35s ease}
  @keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  @media (max-width:700px){.bg{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.g1{grid-row:auto;border-radius:var(--r-xl) var(--r-xl) 0 0 !important}.g2{border-radius:0 0 var(--r-xl) var(--r-xl) !important}.g3{display:none}.card{padding:34px 26px 30px}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="g1"></div><div class="g2"></div><div class="g3"></div></div>
<main class="card" id="card">
  <img src="assets/logo/pm3-logo-roxo.svg" alt="PM3">
  <p class="k">Acesso restrito</p>
  <h1>Site PM3 2027<br>Protótipo alfa</h1>
  <p>Material interno de aprovação. Digite a senha para continuar.</p>
  <form method="post" action="/entrar">
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required autofocus>
    <input type="hidden" name="next" id="next" value="/home.html">
    <p class="err" id="err" role="alert"></p>
    <button type="submit">Entrar</button>
  </form>
</main>
<script>
  const p = new URLSearchParams(location.search);
  const n = p.get('next'); if (n && n.startsWith('/') && !n.startsWith('//')) document.getElementById('next').value = n;
  if (p.get('erro')) { document.getElementById('err').textContent = 'Senha incorreta. Tente de novo.'; document.getElementById('card').classList.add('shake'); }
</script>
</body>
</html>
